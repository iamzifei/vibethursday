<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Vibe Thursday · 小红书封面</title>
<style>
  /* 3:4 poster for Xiaohongshu, rendered at 1200x1600.
     Brand colours kept (ink + electric lime) because on a feed of pale, warm
     covers a near-black card is what actually stops the scroll — the usual
     "viral" bright-pastel treatment would make it blend in. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1200px; height: 1600px; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    background: #0a0b0d;
    color: #f2f5f3;
    -webkit-font-smoothing: antialiased;
  }

  .poster {
    position: relative;
    width: 1200px;
    height: 1600px;
    padding: 96px 88px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Same lattice motif as the site, so the poster and the landing page read
     as one brand when someone follows the link. */
  .grid {
    position: absolute;
    inset: -10% -20% auto -20%;
    height: 130%;
    background-image:
      repeating-linear-gradient(60deg, rgba(198,255,61,.10) 0 2px, transparent 2px 96px),
      repeating-linear-gradient(-60deg, rgba(61,220,255,.07) 0 2px, transparent 2px 96px);
    -webkit-mask-image: linear-gradient(to bottom, #000 0%, transparent 62%);
  }

  .bloom {
    position: absolute;
    top: -18%; left: 50%;
    width: 1100px; aspect-ratio: 1;
    transform: translateX(-50%);
    background: radial-gradient(circle, rgba(198,255,61,.16) 0%, rgba(198,255,61,0) 62%);
  }

  /* Excludes the two decorative layers by name. Without :not() this rule has
     the same specificity as their `position: absolute` and, coming later,
     would win — dropping a 130%-tall grid into the flex flow and shoving the
     whole poster off the bottom edge. */
  .poster > *:not(.grid):not(.bloom) { position: relative; z-index: 1; }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 30px;
    font-weight: 600;
    letter-spacing: .22em;
    color: #3ddcff;
  }

  /* The hook. Sized to dominate — on Xiaohongshu the cover is read at
     thumbnail size, where only the largest line survives. */
  .hook {
    margin-top: 64px;
    font-size: 132px;
    font-weight: 700;
    line-height: 1.16;
    letter-spacing: -.03em;
  }

  .hook em { font-style: normal; color: #c6ff3d; }

  /* Marker-pen highlight — the one borrowed Xiaohongshu convention. */
  .hook .mark {
    display: inline-block;
    padding: 0 14px;
    background: #c6ff3d;
    color: #0a0b0d;
    border-radius: 8px;
  }

  .sub {
    margin-top: 52px;
    font-size: 44px;
    font-weight: 500;
    line-height: 1.55;
    color: #a4acb4;
  }

  .sub b { color: #f2f5f3; font-weight: 600; }

  /* Fills the gap between the hook and the facts with what actually makes
     this different from the other AI meetups. Deliberately evergreen — no
     specific date — so the same poster can be reposted every week. */
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 64px;
  }

  .chip {
    padding: 18px 30px;
    border: 2px solid #2a3038;
    border-radius: 999px;
    font-size: 32px;
    font-weight: 600;
    color: #a4acb4;
  }

  .chip.on {
    border-color: rgba(198,255,61,.45);
    background: rgba(198,255,61,.08);
    color: #c6ff3d;
  }

  .spacer { flex: 1; }

  .facts {
    display: flex;
    gap: 20px;
    margin-bottom: 40px;
  }

  .fact {
    flex: 1;
    padding: 30px 26px;
    background: #121417;
    border: 2px solid #2a3038;
    border-radius: 20px;
  }

  .fact dt {
    font-size: 26px;
    color: #6b7480;
    margin-bottom: 12px;
    letter-spacing: .06em;
  }

  .fact dd { font-size: 40px; font-weight: 700; color: #f2f5f3; }
  .fact dd small { font-size: 30px; font-weight: 600; }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 36px;
    border-top: 2px solid #2a3038;
  }

  .brand { font-size: 40px; font-weight: 700; letter-spacing: -.02em; }
  .brand span { color: #c6ff3d; }

  .url {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 30px;
    color: #6b7480;
  }

  .who {
    margin-top: 24px;
    font-size: 25px;
    line-height: 1.6;
    color: #6b7480;
    letter-spacing: .02em;
  }
</style>
</head>
<body>
  <div class="poster">
    <div class="grid"></div>
    <div class="bloom"></div>

    <div class="eyebrow">SYDNEY · 每周四上午</div>

    <h1 class="hook">
      在悉尼<br>
      用 AI 做东西的<br>
      <span class="mark">别一个人做</span>
    </h1>

    <p class="sub">
      产品、自动化、内容流水线、投放打法——<br>
      带上来讲 <b>5 分钟</b>。<b>跑不通的一样欢迎。</b>
    </p>

    <div class="chips">
      <span class="chip">不是讲座</span>
      <span class="chip on">不用会写代码</span>
      <span class="chip">每周四，雷打不动</span>
    </div>

    <div class="spacer"></div>

    <dl class="facts">
      <div class="fact">
        <dt>时间</dt>
        <dd>每周四<br><small>10:00–13:00</small></dd>
      </div>
      <div class="fact">
        <dt>地点</dt>
        <dd>悉尼 CBD<br><small>报名后告知</small></dd>
      </div>
      <div class="fact">
        <dt>费用</dt>
        <dd>免费<br><small>咖啡自理</small></dd>
      </div>
    </dl>

    <div class="footer">
      <div class="brand">Vibe <span>Thursday</span></div>
      <div class="url">vibethursday.com</div>
    </div>

    <div class="who">
      独立开发 · AI 初创团队 · 自媒体 / 内容创作 · 自由职业 · 数字游民<br>
      公司里的工程师 / 产品 / 设计 / 运营 · 想把 AI 落地的中层
    </div>
  </div>
</body>
</html>
