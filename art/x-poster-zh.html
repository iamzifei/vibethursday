<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Vibe Thursday · X 中文卡片</title>
<style>
  /* 16:9 card for X, rendered at 1600x900.
     Landscape rather than the 3:4 used on Xiaohongshu: X crops portrait images
     in the timeline, which would cut the headline off. Unlike Xiaohongshu,
     X places no restriction on links, so the URL is on the card. */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { width: 1600px; height: 900px; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    background: #0a0b0d;
    color: #f2f5f3;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1600px;
    height: 900px;
    padding: 72px 80px;
    display: flex;
    gap: 64px;
    overflow: hidden;
  }

  .grid {
    position: absolute;
    inset: -10% -10% auto -10%;
    height: 140%;
    background-image:
      repeating-linear-gradient(60deg, rgba(198,255,61,.10) 0 2px, transparent 2px 92px),
      repeating-linear-gradient(-60deg, rgba(61,220,255,.07) 0 2px, transparent 2px 92px);
    -webkit-mask-image: linear-gradient(to left, #000 0%, transparent 68%);
  }

  .bloom {
    position: absolute;
    top: -30%; right: -8%;
    width: 900px; aspect-ratio: 1;
    background: radial-gradient(circle, rgba(198,255,61,.17) 0%, rgba(198,255,61,0) 62%);
  }

  /* Named exclusions: without them this rule would override the decorative
     layers' `position: absolute` and drop them into the flex row. */
  .card > *:not(.grid):not(.bloom) { position: relative; z-index: 1; }

  .main { flex: 1; display: flex; flex-direction: column; }
  .side { width: 400px; display: flex; flex-direction: column; }

  .eyebrow {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: .2em;
    color: #3ddcff;
  }

  /* Slightly smaller than the English card: Chinese glyphs are full-width, so
     the same point size runs considerably wider per line. */
  .hook {
    margin-top: 30px;
    font-size: 82px;
    font-weight: 700;
    line-height: 1.16;
    letter-spacing: -.03em;
  }

  .hook .mark {
    display: inline-block;
    margin-top: 12px;
    padding: 2px 16px;
    background: #c6ff3d;
    color: #0a0b0d;
    border-radius: 10px;
  }

  .sub {
    margin-top: 36px;
    font-size: 30px;
    line-height: 1.6;
    color: #a4acb4;
  }

  .sub b { color: #f2f5f3; font-weight: 600; }

  .grow { flex: 1; min-height: 16px; }

  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; }

  .chip {
    padding: 12px 24px;
    border: 2px solid #2a3038;
    border-radius: 999px;
    font-size: 23px;
    font-weight: 600;
    color: #a4acb4;
  }

  .chip.on {
    border-color: rgba(198,255,61,.45);
    background: rgba(198,255,61,.08);
    color: #c6ff3d;
  }

  .fact {
    padding: 22px 24px;
    background: #121417;
    border: 2px solid #2a3038;
    border-radius: 16px;
    margin-bottom: 14px;
  }

  .fact dt {
    font-size: 20px;
    letter-spacing: .1em;
    color: #6b7480;
    margin-bottom: 8px;
  }

  .fact dd { font-size: 32px; font-weight: 700; }
  .fact dd small { display: block; font-size: 23px; font-weight: 500; color: #a4acb4; margin-top: 4px; }

  .url {
    margin-top: auto;
    padding: 24px;
    background: #c6ff3d;
    color: #0a0b0d;
    border-radius: 16px;
    text-align: center;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  .brand { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 18px; }
  .brand span { color: #c6ff3d; }

  .note {
    margin-top: 22px;
    font-size: 22px;
    color: #6b7480;
    line-height: 1.55;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>
    <div class="bloom"></div>

    <div class="main">
      <div class="eyebrow">SYDNEY · 每周四上午</div>

      <h1 class="hook">
        在悉尼<br>
        用 AI 做东西的<br>
        <span class="mark">别一个人做</span>
      </h1>

      <p class="sub">
        产品、自动化、内容流水线、投放打法——带上来讲 <b>5 分钟</b>。<br>
        <b>没做完的、只是个想法的，一样算。</b>
      </p>

      <div class="grow"></div>

      <div class="chips">
        <span class="chip">不是讲座</span>
        <span class="chip on">不用会写代码</span>
        <span class="chip">每周四，雷打不动</span>
      </div>

      <p class="note">
        独立开发 · AI 初创团队 · 自媒体 / 内容创作 · 自由职业 · 数字游民<br>
        公司里的工程师 / 产品 / 设计 / 运营 · 想把 AI 落地的中层
      </p>
    </div>

    <div class="side">
      <div class="brand">Vibe <span>Thursday</span></div>

      <dl class="fact">
        <dt>时间</dt>
        <dd>每周四<small>10:00 – 13:00</small></dd>
      </dl>
      <dl class="fact">
        <dt>地点</dt>
        <dd>悉尼 CBD<small>报名后告知</small></dd>
      </dl>
      <dl class="fact">
        <dt>费用</dt>
        <dd>免费<small>咖啡自理</small></dd>
      </dl>

      <div class="url">vibethursday.com</div>
    </div>
  </div>
</body>
</html>
